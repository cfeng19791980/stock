<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波段股票分析系统 - 启动中</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .loader-container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .version {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-box {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-width: 500px;
            min-width: 300px;
        }
        .progress-title {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .progress-log {
            font-size: 12px;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
        }
        .progress-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .progress-item.success { color: #10b981; }
        .progress-item.error { color: #ef4444; }
        .status-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            color: #ef4444;
        }
        .retry-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">📊</div>
        <h1>波段股票分析系统 v2.2</h1>
        <div class="version">XGBoost + 43特征 | 买点卖点预测</div>
        
        <div class="spinner"></div>
        
        <div class="progress-box">
            <div class="progress-title">正在启动分析引擎...</div>
            <div class="progress-log" id="progress-log">
                <div class="progress-item">初始化...</div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="dot"></div>
                <span>后台服务启动中</span>
            </div>
            <div class="status-item" id="backend-status">
                等待连接...
            </div>
        </div>
        
        <div class="error-box" id="error-box" style="display: none;">
            <div id="error-message"></div>
            <button class="retry-btn" onclick="retryStart()">重新启动</button>
        </div>
    </div>
    
    <script>
        const progressLog = document.getElementById('progress-log');
        const backendStatus = document.getElementById('backend-status');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');
        
        // 监听后端进度
        window.electronAPI.onBackendProgress((msg) => {
            addLog(msg);
        });
        
        // 监听后端就绪
        window.electronAPI.onBackendReady(() => {
            backendStatus.textContent = '服务已就绪 ✓';
            backendStatus.style.color = '#10b981';
            addLog('✓ 服务启动完成，正在加载主界面...', 'success');
        });
        
        // 监听后端错误
        window.electronAPI.onBackendError((err) => {
            errorBox.style.display = 'block';
            errorMessage.textContent = err;
            backendStatus.textContent = '启动失败';
            backendStatus.style.color = '#ef4444';
            addLog('✗ ' + err, 'error');
        });
        
        function addLog(msg, type = '') {
            const item = document.createElement('div');
            item.className = 'progress-item ' + type;
            
            // 提取关键信息
            if (msg.includes('✓')) {
                item.classList.add('success');
            } else if (msg.includes('✗') || msg.includes('Error')) {
                item.classList.add('error');
            }
            
            // 简化日志
            if (msg.includes('训练模型') || msg.includes('加载大盘') || msg.includes('分析股票')) {
                item.textContent = msg.substring(0, 50);
            } else {
                item.textContent = msg.substring(0, 80);
            }
            
            progressLog.appendChild(item);
            progressLog.scrollTop = progressLog.scrollHeight;
            
            // 限制日志条数
            while (progressLog.children.length > 20) {
                progressLog.removeChild(progressLog.firstChild);
            }
        }
        
        async function retryStart() {
            errorBox.style.display = 'none';
            progressLog.innerHTML = '<div class="progress-item">重新启动...</div>';
            backendStatus.textContent = '等待连接...';
            backendStatus.style.color = '#888';
            
            // 调用刷新
            await window.electronAPI.refreshData();
            
            // 检查后端状态
            setTimeout(async () => {
                const status = await window.electronAPI.checkBackend();
                if (status.ready) {
                    window.electronAPI.onBackendReady();
                }
            }, 5000);
        }
        
        // 模拟启动进度
        setTimeout(() => addLog('检查数据新鲜度...'), 500);
        setTimeout(() => addLog('加载大盘数据...'), 1500);
        setTimeout(() => addLog('训练XGBoost模型...'), 3000);
    </script>
</body>
</html>
