<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波段股票分析系统 v3.0 - 增强版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 1800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header .time-info { font-size: 14px; color: #888; margin-top: 10px; }
        
        .refresh-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        .refresh-btn:hover { transform: scale(1.05); }
        
        /* 四栏布局 */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 500px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        
        .panel-title { font-size: 18px; font-weight: bold; }
        .panel-count {
            font-size: 12px;
            color: #888;
            padding: 5px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        
        /* 股票卡片 */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
        }
        
        .stock-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s;
        }
        .stock-card:hover { background: rgba(255,255,255,0.12); }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .stock-name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        
        .stock-code {
            font-size: 12px;
            color: #888;
        }
        
        .stock-score {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .score-badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .score-high { background: #10b981; color: #fff; }
        .score-medium { background: #f59e0b; color: #fff; }
        .score-low { background: #ef4444; color: #fff; }
        .score-hold { background: #6366f1; color: #fff; }
        
        .stock-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .stock-advice {
            font-size: 13px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            margin-top: 8px;
        }
        
        .advice-buy { color: #10b981; border-left: 3px solid #10b981; }
        .advice-sell { color: #ef4444; border-left: 3px solid #ef4444; }
        .advice-hold { color: #6366f1; border-left: 3px solid #6366f1; }
        .advice-watch { color: #f59e0b; border-left: 3px solid #f59e0b; }
        
        /* 持仓股板块特殊样式 */
        .holding-card {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .holding-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }
        
        .holding-item {
            background: rgba(0,0,0,0.15);
            padding: 6px;
            border-radius: 4px;
        }
        
        .profit-positive { color: #10b981; }
        .profit-negative { color: #ef4444; }
        
        /* 详细报告面板 */
        .report-panel {
            grid-column: 1 / -1;
            margin-top: 20px;
        }
        
        .report-content {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        
        .report-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 15px;
        }
        
        .report-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .report-detail {
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
        
        /* 统计面板 */
        .stats-panel {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
        }
        
        /* 滚动条样式 */
        .stock-list::-webkit-scrollbar { width: 6px; }
        .stock-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .stock-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📊 波段股票分析系统 v3.0 增强版</h1>
            <div class="time-info" id="updateTime">加载中...</div>
            <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
            <button class="refresh-btn" onclick="runAnalysis()">▶️ 运行分析</button>
        </div>
        
        <!-- 四栏布局：买入、持仓、卖出、观望 -->
        <div class="grid">
            <!-- 买入推荐 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🟢 买入推荐</span>
                    <span class="panel-count" id="buyCount">0只</span>
                </div>
                <div class="stock-list" id="buyList">加载中...</div>
            </div>
            
            <!-- 持仓股板块（新增） -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🔵 持仓监控</span>
                    <span class="panel-count" id="holdCount">0只</span>
                </div>
                <div class="stock-list" id="holdList">加载中...</div>
            </div>
            
            <!-- 卖出建议 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🔴 卖出建议</span>
                    <span class="panel-count" id="sellCount">0只</span>
                </div>
                <div class="stock-list" id="sellList">加载中...</div>
            </div>
            
            <!-- 观望股票 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🟡 观望池</span>
                    <span class="panel-count" id="watchCount">0只</span>
                </div>
                <div class="stock-list" id="watchList">加载中...</div>
            </div>
        </div>
        
        <!-- 统计面板 -->
        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalProfit">--</div>
                    <div class="stat-label">持仓盈亏</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgScore">--</div>
                    <div class="stat-label">平均评分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="winRate">--</div>
                    <div class="stat-label">胜率预估</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="riskLevel">--</div>
                    <div class="stat-label">风险等级</div>
                </div>
            </div>
        </div>
        
        <!-- 详细报告面板 -->
        <div class="panel report-panel">
            <div class="panel-header">
                <span class="panel-title">📋 详细分析报告</span>
            </div>
            <div class="report-content" id="reportContent">加载中...</div>
        </div>
    </div>
    
    <script>
        // 持仓数据（可编辑）
        let holdings = [
            { code: '688028.SH', name: '沃尔德', shares: 1000, buyPrice: 45.20, buyDate: '2026-04-15' },
            { code: '688195.SH', name: '芯源微', shares: 500, buyPrice: 78.50, buyDate: '2026-04-10' },
            { code: '300136.SZ', name: '信维通导', shares: 800, buyPrice: 32.00, buyDate: '2026-04-08' },
        ];
        
        // 加载分析结果
        function loadData() {
            fetch('result.json')
                .then(r => r.json())
                .then(data => {
                    displayData(data);
                    displayHoldings(data);
                    displayReport(data);
                })
                .catch(e => {
                    document.getElementById('buyList').innerHTML = '<div style="color:#888;text-align:center;">请先运行分析</div>';
                });
        }
        
        // 显示分类数据
        function displayData(data) {
            const stocks = data.stocks || [];
            
            // 分类
            const buyStocks = stocks.filter(s => s.score >= 60);
            const sellStocks = stocks.filter(s => s.score < 15);
            const watchStocks = stocks.filter(s => s.score >= 15 && s.score < 60);
            
            // 买入列表
            document.getElementById('buyCount').textContent = buyStocks.length + '只';
            document.getElementById('buyList').innerHTML = buyStocks.map(s => `
                <div class="stock-card">
                    <div class="stock-header">
                        <div>
                            <span class="stock-name">${s.name}</span>
                            <span class="stock-code">${s.code}</span>
                        </div>
                        <div class="stock-score">
                            <span class="score-badge score-high">${s.score}</span>
                        </div>
                    </div>
                    <div class="stock-info">
                        <span>涨幅概率: ${s.score}%</span>
                        <span>${s.close}元</span>
                    </div>
                    <div class="stock-advice advice-buy">
                        ${getBuyAdvice(s)}
                    </div>
                </div>
            `).join('');
            
            // 卖出列表
            document.getElementById('sellCount').textContent = sellStocks.length + '只';
            document.getElementById('sellList').innerHTML = sellStocks.map(s => `
                <div class="stock-card">
                    <div class="stock-header">
                        <div>
                            <span class="stock-name">${s.name}</span>
                            <span class="stock-code">${s.code}</span>
                        </div>
                        <div class="stock-score">
                            <span class="score-badge score-low">${s.score}</span>
                        </div>
                    </div>
                    <div class="stock-info">
                        <span>跌幅概率: ${100-s.score}%</span>
                        <span>${s.close}元</span>
                    </div>
                    <div class="stock-advice advice-sell">
                        ${getSellAdvice(s)}
                    </div>
                </div>
            `).join('');
            
            // 观望列表
            document.getElementById('watchCount').textContent = watchStocks.length + '只';
            document.getElementById('watchList').innerHTML = watchStocks.map(s => `
                <div class="stock-card">
                    <div class="stock-header">
                        <div>
                            <span class="stock-name">${s.name}</span>
                            <span class="stock-code">${s.code}</span>
                        </div>
                        <div class="stock-score">
                            <span class="score-badge score-medium">${s.score}</span>
                        </div>
                    </div>
                    <div class="stock-info">
                        <span>概率: ${s.score}%</span>
                        <span>${s.close}元</span>
                    </div>
                    <div class="stock-advice advice-watch">
                        ${getWatchAdvice(s)}
                    </div>
                </div>
            `).join('');
            
            // 更新时间
            document.getElementById('updateTime').textContent = data.update_time || '--';
            
            // 统计
            if (stocks.length > 0) {
                const avgScore = stocks.reduce((a, b) => a + b.score, 0) / stocks.length;
                document.getElementById('avgScore').textContent = Math.round(avgScore);
                document.getElementById('winRate').textContent = Math.round(buyStocks.length / stocks.length * 100) + '%';
                document.getElementById('riskLevel').textContent = avgScore > 50 ? '低' : avgScore > 30 ? '中' : '高';
            }
        }
        
        // 显示持仓股（新增功能）
        function displayHoldings(data) {
            const stocks = data.stocks || [];
            
            // 匹配持仓股与分析结果
            const holdingList = holdings.map(h => {
                const analysis = stocks.find(s => s.code === h.code) || {};
                const currentPrice = analysis.close || h.buyPrice;
                const profit = (currentPrice - h.buyPrice) / h.buyPrice * 100;
                const holdDays = Math.floor((new Date() - new Date(h.buyDate)) / 86400000);
                
                return {
                    ...h,
                    currentPrice,
                    profit,
                    holdDays,
                    score: analysis.score || 50,
                    advice: getHoldingAdvice(profit, analysis.score, holdDays)
                };
            });
            
            document.getElementById('holdCount').textContent = holdingList.length + '只';
            document.getElementById('holdList').innerHTML = holdingList.map(h => `
                <div class="stock-card holding-card">
                    <div class="stock-header">
                        <div>
                            <span class="stock-name">${h.name}</span>
                            <span class="stock-code">${h.code}</span>
                        </div>
                        <div class="stock-score">
                            <span class="score-badge ${h.profit > 0 ? 'score-high' : 'score-low'}">
                                ${h.profit > 0 ? '+' : ''}${h.profit.toFixed(1)}%
                            </span>
                        </div>
                    </div>
                    <div class="holding-info">
                        <div class="holding-item">持仓: ${h.shares}股</div>
                        <div class="holding-item">成本: ${h.buyPrice}元</div>
                        <div class="holding-item">现价: ${h.currentPrice}元</div>
                        <div class="holding-item">天数: ${h.holdDays}天</div>
                    </div>
                    <div class="stock-info">
                        <span>当前评分: ${h.score}</span>
                    </div>
                    <div class="stock-advice ${h.profit > 10 ? 'advice-sell' : h.profit < -5 ? 'advice-sell' : 'advice-hold'}">
                        ${h.advice}
                    </div>
                </div>
            `).join('');
            
            // 持仓统计
            const totalProfit = holdingList.reduce((a, b) => a + b.profit * b.shares * b.buyPrice / 100, 0);
            document.getElementById('totalProfit').textContent = (totalProfit > 0 ? '+' : '') + Math.round(totalProfit) + '元';
        }
        
        // 显示详细报告（新增功能）
        function displayReport(data) {
            const stocks = data.stocks || [];
            const buyStocks = stocks.filter(s => s.score >= 60);
            const sellStocks = stocks.filter(s => s.score < 15);
            
            const reports = [
                {
                    title: '🎯 今日策略',
                    detail: `推荐买入${buyStocks.length}只股票，建议卖出${sellStocks.length}只。重点关注评分>70的高质量标的。`
                },
                {
                    title: '⚠️ 风险提示',
                    detail: sellStocks.length > 3 ? `有${sellStocks.length}只股票评分低于15，存在较大下跌风险，建议及时止损。` : '当前卖出信号较少，整体风险可控。'
                },
                {
                    title: '💡 操作建议',
                    detail: `买入时建议使用T+1策略，次日开盘价买入。单笔不超过总资金20%，分散持仓降低风险。`
                },
                {
                    title: '📊 市场分析',
                    detail: data.market_analysis || '大盘震荡整理，建议谨慎操作，关注成交量变化。'
                },
                {
                    title: '📅 持仓规划',
                    detail: `平均持仓建议8-15天，盈利>25%考虑止盈，亏损>10%触发止损。避免追涨杀跌。`
                },
            ];
            
            document.getElementById('reportContent').innerHTML = reports.map(r => `
                <div class="report-card">
                    <div class="report-title">${r.title}</div>
                    <div class="report-detail">${r.detail}</div>
                </div>
            `).join('');
        }
        
        // 买入建议生成
        function getBuyAdvice(s) {
            if (s.score >= 80) return '强烈推荐买入！高质量标的，建议优先配置。';
            if (s.score >= 70) return '推荐买入。评分较高，可适当增加仓位。';
            if (s.score >= 60) return '可考虑买入。评分达标，建议分批建仓。';
            return '观望。评分较低，等待更好时机。';
        }
        
        // 卖出建议生成
        function getSellAdvice(s) {
            const dropProb = 100 - s.score;
            if (dropProb >= 90) return '强烈建议卖出！跌幅概率极高，及时止损离场。';
            if (dropProb >= 85) return '建议卖出。下跌风险较大，控制损失。';
            return '谨慎观望。可考虑减仓，等待反弹。';
        }
        
        // 观望建议生成
        function getWatchAdvice(s) {
            if (s.score >= 40) return '接近买入阈值，持续观察，突破60可进场。';
            if (s.score >= 25) return '评分中性，暂不操作，等待明确信号。';
            return '评分偏低，不建议操作，关注后续走势。';
        }
        
        // 持仓建议生成（新增功能）
        function getHoldingAdvice(profit, score, days) {
            if (profit > 25) return '已达到止盈线(25%)，建议分批卖出锁定收益。';
            if (profit > 15) return '盈利可观，考虑部分止盈，保留底仓。';
            if (profit < -10) return '触发止损线(-10%)，建议果断卖出止损。';
            if (profit < -5 && score < 20) return '亏损且评分低，建议止损离场。';
            if (days > 15 && profit < 5) return '持仓时间较长且盈利有限，考虑换股。';
            if (score < 30) return '评分下降，注意风险，可考虑减仓。';
            return '继续持有，关注后续走势和评分变化。';
        }
        
        // 刷新数据
        function refreshData() {
            loadData();
        }
        
        // 运行分析
        function runAnalysis() {
            alert('请在命令行运行: python analyzer_json_v3.2.py');
        }
        
        // 初始化
        loadData();
        
        // 自动刷新（每5分钟）
        setInterval(loadData, 300000);
    </script>
</body>
</html>
